name: Build Kosimovskiy Mixer Pantone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Extract project
        run: |
          mkdir -p buildsrc
          unzip -q "$(find . -maxdepth 1 -name '*.zip' -print -quit)" -d buildsrc

      - name: Prepare Pantone database
        working-directory: buildsrc/PantoneMixer
        run: |
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import urllib.request

          url = "https://raw.githubusercontent.com/aj90909/unofficial-pantone-solid-coated-2024-v5/main/colors.csv"
          data = urllib.request.urlopen(url).read().decode("utf-8")

          rows = []
          for line in data.splitlines()[1:]:
              p = line.split(",")
              if len(p) >= 5:
                  rows.append(f"{p[0]};{p[2]};{p[3]};{p[4]}")

          with open("app/src/main/assets/pantone_colors.csv", "w", encoding="utf-8") as f:
              f.write("\n".join(rows))

          print("Pantone colors:", len(rows))

          if len(rows) < 3000:
              raise RuntimeError("Pantone database was not downloaded correctly")
          PY

      - name: Build APK
        working-directory: buildsrc/PantoneMixer
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kosimovskiy-Mixer-Pantone-v1.4-APK
          path: buildsrc/PantoneMixer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
